<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەیامێکی تایبەت ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            font-family: Arial, sans-serif;
            text-align: center;
            direction: rtl;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 90%;
            width: 360px;
        }

        img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        p {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.8;
            margin: 0;
            white-space: pre-line;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- وێنەی پشیلەیەک گوڵی بەدەستەوەیە -->
        <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=600&q=80" alt="Cute Cat with Flower">
        <p>دیییییە، نازانم چۆن ئەو هەستە دەرببڕم، بەسسس ئەمەوێێێ بزانیت کە بوونت لە ژیانمدا شتێکی زۆر جوانە. ❤️

لە قسەکردنت، لە شێوازی بیرکردنەوەت و تەنانەت لە بچووکترین شتەکانیشتدا زۆر جیاواز و تایبەتی🥹😭.

تۆ بۆ من تەنها کچێکی ئاسایی نیت، کەسێکی جیاوازیت کە هەر جارێک قسەت لەگەڵ دەکەم، دڵم ئارامتر دەبێت.</p>
    </div>

</body>
</html>
